<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" role="img" aria-labelledby="title desc">
<title id="title">AI 短剧制作流程图</title>
<desc id="desc">完整流程固定顺序：大纲、人物、美术、剧本、制作。逐阶段完成交接，不跳过或并行推进。单个技能仍可独立运行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#677575" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;text-anchor:middle;fill:#233a3c}.label{font-size:19px;font-weight:600}.detail{font-size:14px;fill:#52686b}.note{font-size:14px;fill:#56615a}rect{stroke:#869b99;stroke-width:1;rx:10}line{stroke:#677575;stroke-width:1.5}</style>
<g><rect x="120" y="22" width="440" height="72" fill="#f0eee6"/><text class="label" x="340" y="51">已有剧本</text><text class="detail" x="340" y="75">共同来源与项目要求</text></g>
<line x1="340" y1="95" x2="340" y2="117" marker-end="url(#arrow)"/>
<g><rect x="120" y="120" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="149">1. outline · 故事结构</text><text class="detail" x="340" y="173">故事、剧情节点、分集与来源</text></g>
<line x1="340" y1="193" x2="340" y2="215" marker-end="url(#arrow)"/>
<g><rect x="120" y="218" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="247">2. characters · 人物身份</text><text class="detail" x="340" y="271">独立判定身份、别名与角色设计</text></g>
<line x1="340" y1="291" x2="340" y2="313" marker-end="url(#arrow)"/>
<g><rect x="120" y="316" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="345">3. art · 美术资产</text><text class="detail" x="340" y="369">独立识别地点、物品与视觉设计</text></g>
<line x1="340" y1="389" x2="340" y2="411" marker-end="url(#arrow)"/>
<g><rect x="120" y="414" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="443">4. script · 执行正文</text><text class="detail" x="340" y="467">场次、声音与显式身份映射</text></g>
<line x1="340" y1="487" x2="340" y2="509" marker-end="url(#arrow)"/>
<g><rect x="120" y="512" width="440" height="72" fill="#faece7"/><text class="label" x="340" y="541">5. creation · 制作交接</text><text class="detail" x="340" y="565">制作规划、提示词与独立审核</text></g>
<text class="note" x="340" y="639">完整流程不跳过、倒序或并行推进。</text>
<text class="note" x="340" y="667">身份登记不强制出图；媒体生成按需求与授权执行。</text>
<text class="note" x="340" y="695">流程状态不等于语义审核或成片审核通过。</text>
</svg>
