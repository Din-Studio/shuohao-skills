<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" role="img" aria-labelledby="title desc">
<title id="title">AI short-drama production pipeline</title>
<desc id="desc">Fixed order: outline, characters, art, script, creation. Finish each handoff before the next stage. Standalone skills remain independent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#677575" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;text-anchor:middle;fill:#233a3c}.label{font-size:19px;font-weight:600}.detail{font-size:14px;fill:#52686b}.note{font-size:14px;fill:#56615a}rect{stroke:#869b99;stroke-width:1;rx:10}line{stroke:#677575;stroke-width:1.5}</style>
<g><rect x="120" y="22" width="440" height="72" fill="#f0eee6"/><text class="label" x="340" y="51">Existing screenplay</text><text class="detail" x="340" y="75">Shared source evidence</text></g>
<line x1="340" y1="95" x2="340" y2="117" marker-end="url(#arrow)"/>
<g><rect x="120" y="120" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="149">1. outline</text><text class="detail" x="340" y="173">Story · events · episodes</text></g>
<line x1="340" y1="193" x2="340" y2="215" marker-end="url(#arrow)"/>
<g><rect x="120" y="218" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="247">2. characters</text><text class="detail" x="340" y="271">Independent character identities</text></g>
<line x1="340" y1="291" x2="340" y2="313" marker-end="url(#arrow)"/>
<g><rect x="120" y="316" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="345">3. art</text><text class="detail" x="340" y="369">Independent places and props</text></g>
<line x1="340" y1="389" x2="340" y2="411" marker-end="url(#arrow)"/>
<g><rect x="120" y="414" width="440" height="72" fill="#e8f2f0"/><text class="label" x="340" y="443">4. script</text><text class="detail" x="340" y="467">Execution text · explicit mappings</text></g>
<line x1="340" y1="487" x2="340" y2="509" marker-end="url(#arrow)"/>
<g><rect x="120" y="512" width="440" height="72" fill="#faece7"/><text class="label" x="340" y="541">5. creation</text><text class="detail" x="340" y="565">Production plan · independent review</text></g>
<text class="note" x="340" y="639">No skipped, reversed or parallel stages in full-flow mode.</text>
<text class="note" x="340" y="667">Identity registration does not require generated images.</text>
<text class="note" x="340" y="695">Project status is not semantic or finished-media approval.</text>
</svg>
